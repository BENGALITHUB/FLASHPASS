<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B14" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FlashPass — High-Speed Ingress &amp; Ticketing</title>
    <meta name="description" content="Book event passes in 30 seconds with UPI — instant digital pass, no app, zero gate queues. Live comic-cons, fests and concerts powered by FlashPass." />

    <!-- Social share previews (WhatsApp / Facebook / X). Absolute URLs are injected at build time when VITE_SITE_URL is set. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlashPass" />
    <meta property="og:title" content="FlashPass — Instant Event Passes, Zero Gate Queues" />
    <meta property="og:description" content="Book your pass in 30 seconds with UPI. No app, no printing — just scan and walk in." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlashPass — Instant Event Passes, Zero Gate Queues" />
    <meta name="twitter:description" content="Book your pass in 30 seconds with UPI. No app, no printing — just scan and walk in." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <!-- Google Fonts: Bangers, Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-text antialiased selection:bg-primary selection:text-primary-foreground min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
