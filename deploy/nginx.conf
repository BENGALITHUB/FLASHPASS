# ==============================================================================
# FlashPass Production Nginx Configuration
# Reverse Proxy with WebSocket / Socket.io Support & SSL Ready
# ==============================================================================

# Upstream backend running on port 5000
upstream flashpass_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP Server - Redirect to HTTPS (or serve directly if SSL is not configured yet)
server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g., ticket.yourdomain.com)

    # Let's Encrypt ACME challenge location for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Socket.io WebSockets (Crucial for Turnstile Scanner & Live Footfall Updates)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://flashpass_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite build assets: JS, CSS, fonts, images)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        proxy_pass http://flashpass_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # --------------------------------------------------------------------------
    # API Endpoints & Single Page Application (SPA) Fallback
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://flashpass_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
