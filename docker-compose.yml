version: '3.8'

services:
  flashpass:
    build:
      context: .
      dockerfile: Dockerfile
    image: flashpass:latest
    container_name: flashpass-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TRUST_PROXY=1
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
